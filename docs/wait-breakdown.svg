<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="30" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111">What a borrower waits through after they stop talking</text><text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">Mean of a 5-turn simulated call, 4.6 seconds in all</text><rect x="40.0" y="70" width="84.1" height="34" fill="#9aa0a6"/><text x="82.1" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">0.6s</text><text x="82.1" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">Ears (Deepgram)</text><rect x="124.1" y="70" width="200.9" height="34" fill="#555"/><text x="224.5" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">1.4s</text><text x="224.5" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">Brain</text><rect x="325.0" y="70" width="355.0" height="34" fill="#111"/><text x="502.5" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">2.6s</text><text x="502.5" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">Voice (whole sentence)</text><text x="40" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555">The voice is the slow part because it makes a whole sentence before playing it. Streaming voice is next.</text></svg>